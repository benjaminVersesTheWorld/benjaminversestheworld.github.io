---
layout: base
---
<div class="post-with-toc" id="post-wrapper">
  <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
    <nav id="toc-nav">
      <p class="toc-title">On this page</p>
      <ul id="toc-list"></ul>
    </nav>
  </aside>

  <article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
    <header class="post-header">
      <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
      <p class="post-meta">
        <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
          {{ page.date | date: "%b %-d, %Y" }}
        </time>
      </p>
    </header>

    <div class="post-content e-content" itemprop="articleBody">
      {{ content }}
    </div>
  </article>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const wrapper = document.getElementById("post-wrapper");
  const content = document.querySelector(".post-content");
  const tocList = document.getElementById("toc-list");
  const sidebar = document.getElementById("toc-sidebar");
  if (!content || !tocList || !sidebar) return;

  const headings = content.querySelectorAll("h1, h2, h3, h4");
  if (headings.length < 1) {
    sidebar.remove();
    wrapper.classList.remove("post-with-toc");
    return;
  }

  headings.forEach((heading) => {
    if (!heading.id) {
      heading.id = heading.textContent
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
    }

    const li = document.createElement("li");
    li.className = (heading.tagName === "H3" || heading.tagName === "H4") ? "toc-sub" : "toc-main";

    const a = document.createElement("a");
    a.href = `#${heading.id}`;
    a.textContent = heading.textContent;

    li.appendChild(a);
    tocList.appendChild(li);
  });
});
</script>
